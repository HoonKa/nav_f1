name: 안드로이드 APK 빌드

on:
  push:
    branches: [main]
    paths: ["android-app/**", ".github/workflows/android.yml", "icon-512.png"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: android-actions/setup-android@v3
      - name: 의존성 설치 + 동기화
        run: |
          npm ci
          npx cap sync android
      - name: APK 빌드
        working-directory: android-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/debug/app-debug.apk ../../pitwall.apk
      - name: 다운로드 링크(Release)에 올리기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: PitWall 안드로이드 앱 (최신)
          body: |
            휴대폰에서 아래 pitwall.apk 를 눌러 받아 설치하세요.
            빌드 번호 ${{ github.run_number }} · ${{ github.sha }}
          files: pitwall.apk
          make_latest: true
