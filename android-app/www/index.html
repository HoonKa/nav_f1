<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Pit Wall Nav</title></head>
<body style="background:#0b0c10;color:#fff;font-family:sans-serif;margin:0"><p id="m" style="padding:45vh 20px 0;text-align:center">PitWall 불러오는 중…</p>
<script>
// 앱 껍데기: 매번 웹사이트의 최신 화면을 받아 와서 띄운다 (앱 기능 연결은 그대로 유지)
const BASE = "https://hoonka.github.io/nav_f1/";
(async () => {
  let h = null;
  try {
    const r = await fetch(BASE + "index.html?ts=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    h = await r.text();
    try { localStorage.setItem("pw_shell", h); } catch (e) {}
  } catch (e) { try { h = localStorage.getItem("pw_shell"); } catch (_) {} }
  if (!h) { document.getElementById("m").textContent = "인터넷 연결을 확인해 주세요. 다시 시도 중…"; setTimeout(() => location.reload(), 3000); return; }
  h = h.replace(/<head([^>]*)>/i, '<head$1><base href="' + BASE + '">');
  document.open(); document.write(h); document.close();
})();
</script></body></html>
